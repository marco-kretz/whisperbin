services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: /data/local.db
      RATE_LIMIT_REDIS_URL: redis://default:${REDIS_PASSWORD:-changeme}@redis:6379
      TRUSTED_PROXY_IPS: 127.0.0.1,::1
      NODE_ENV: production
      PORT: 3000
    ports:
      - '3000:3000'
    volumes:
      - data:/data
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD:-changeme}
    restart: unless-stopped

volumes:
  data:
